<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5CC26E">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Two Jays Bar Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky search + filter rail over a recipe card grid; tapping a card opens a spec sheet (bottom sheet on phone, side panel on desktop) */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0B0B0B; --muted:#545B56; --line:#E0E5E1;
  --accent:#5CC26E; --on-accent:#0B0B0B; --on-accent-2:#FFFFFF;
  --brass:#2F8A43; --brass-soft:#E9F7EC; --glass:#F1F4F2;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
} 
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#151715; --ink:#FFFFFF; --muted:#A6ADA8; --line:#2A2E2B;
  --accent:#5CC26E; --brass:#7AD889; --brass-soft:#15251A; --glass:#1E221F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#151715; --ink:#FFFFFF; --muted:#A6ADA8; --line:#2A2E2B;
  --accent:#5CC26E; --brass:#7AD889; --brass-soft:#15251A; --glass:#1E221F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{background:var(--accent);color:var(--on-accent);padding-block:28px 22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,68px);line-height:.9;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--on-accent-2)}
.brand p{margin:0;color:var(--on-accent);font-weight:500;opacity:.8}
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;background:none;border:0;color:var(--on-accent);opacity:.65;padding:4px 8px 8px;border-bottom:4px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{opacity:1;border-color:var(--on-accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab:focus-visible{outline-color:var(--on-accent)!important}
.chip:focus-visible,.tab:focus-visible,.card:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 48px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.notice b{color:var(--brass)}
.section-h{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.section-h small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 12px;cursor:pointer;color:inherit;font:inherit;min-width:0}
.card:hover{border-color:var(--ink)}
.card.sig{border-color:var(--brass);background:linear-gradient(var(--brass-soft),var(--surface) 55%)}
.card svg{width:56px;height:72px}
.card .nm{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.card .sub{font-size:12px;color:var(--muted);line-height:1.3}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20}
.sheet{position:fixed;z-index:21;background:var(--surface);color:var(--ink);overflow-y:auto;
  left:0;right:0;bottom:0;max-height:88%;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:820px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;padding:28px 28px 40px}}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head svg{width:70px;height:90px;flex:none}
.sheet h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--glass);color:var(--muted);margin-top:6px}
.tag.sig{background:var(--brass-soft);color:var(--brass)}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:18px 0 6px;font-size:14px}
.meta dt{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.meta dd{margin:0;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.box h3{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.ing{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.ing div{padding:7px 0;border-bottom:1px dashed var(--line)}
.ing div:nth-last-child(-n+2){border-bottom:0}
.ing .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
ol.dir{margin:0;padding-left:20px}
ol.dir li{padding:3px 0}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.note.warn{color:var(--brass);font-weight:600}
/* prep page */
.prep{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.prep .box{background:var(--surface);margin:0}
.prep p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.swap{font-size:14px}
.swap div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.swap div:last-child{border:0}
.swap span:last-child{font-weight:600;text-align:right}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Two <span>Jays</span> Bar Book</h1></div>
</div></header>

<div class="bar" id="bar">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Search drinks or ingredients (e.g. jameson, mint, red bull)" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></aside>

["Buttery Nipple","shot",["liqueur"],"shot","#D9B06E","",[["Butterscotch Schnapps","0.75 oz"],["Baileys","0.75 oz (float)"]],["Pour butterscotch first","Float Baileys over spoon"]],

];
const CAT={sig:"Two Jays Signatures",classic:"Classics",shot:"Shots"};
const CATSUB={sig:"Our menu",classic:"Cocktails, highballs & bar calls",shot:"Shooters & bombs"};
const FILTERS=[["all","All"],["sig","Signatures"],["classic","Classics"],["shot","Shots"],["vodka","Vodka"],["gin","Gin"],["rum","Rum"],["tequila","Tequila & Mezcal"],["whiskey","Whiskey"],["liqueur","Liqueur"]];
const GL={
 rocks:{o:"M12 30 L48 30 L45 72 L15 72 Z",l:"M13.4 42 L46.6 42 L45 72 L15 72 Z",x:""},
 highball:{o:"M18 8 L42 8 L40 74 L20 74 Z",l:"M18.6 24 L41.4 24 L40 74 L20 74 Z",x:""},
 coupe:{o:"M8 24 L52 24 Q50 44 30 46 Q10 44 8 24 Z",l:"M10 28 L50 28 Q47 43 30 44 Q13 43 10 28 Z",x:"M30 46 L30 70 M19 72 L41 72"},
 martini:{o:"M6 14 L54 14 L30 42 Z",l:"M11 19 L49 19 L30 41 Z",x:"M30 42 L30 70 M19 72 L41 72"},
 shot:{o:"M21 40 L39 40 L37 72 L23 72 Z",l:"M21.6 50 L38.4 50 L37 72 L23 72 Z",x:""},
 mule:{o:"M13 26 L45 26 L43 72 L15 72 Z",l:"M13 26 L45 26 L43 72 L15 72 Z",x:"M45 34 Q57 35 55 48 Q53 58 44 58"},
 wine:{o:"M16 8 L44 8 Q46 40 30 46 Q14 40 16 8 Z",l:"M15.8 24 L44.2 24 Q44 40 30 44.5 Q16 40 15.8 24 Z",x:"M30 46 L30 70 M20 72 L40 72"},
 flute:{o:"M23 6 L37 6 L35.5 46 Q30 50 24.5 46 Z",l:"M23.4 16 L36.6 16 L35.5 46 Q30 49 24.5 46 Z",x:"M30 50 L30 72 M22 74 L38 74"}
};
function glass(g,c){const G=GL[g];return `<svg viewBox="0 0 60 80" aria-hidden="true"><path d="${G.o}" fill="var(--glass)"/><path d="${G.l}" fill="${c}" opacity=".92"/><path d="${G.o}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>${G.x?`<path d="${G.x}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>`:""}</svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const R=D.map((d,i)=>({i,n:d[0],c:d[1]==="college"?"classic":d[1],s:d[2],g:d[3],col:d[4],garn:d[5],ing:d[6],dir:d[7],note:d[8]||""}));
let filter="all",q="";
const main=document.getElementById("main"),chips=document.getElementById("chips"),bar=document.getElementById("bar");
chips.innerHTML=FILTERS.map(([k,l])=>`<button class="chip" id="f-${k}" data-f="${k}" aria-pressed="${k==="all"}">${l}</button>`).join("");
chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()};
document.getElementById("q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
function match(r){
  if(filter!=="all"){ if(CAT[filter]){if(r.c!==filter)return false} else if(!r.s.includes(filter)&&!(filter==="tequila"&&r.s.includes("mezcal")))return false }
  if(!q)return true;
  return (r.n+" "+r.ing.map(x=>x[0]).join(" ")+" "+r.s.join(" ")+" "+r.garn).toLowerCase().includes(q);
}
function card(r){const sub=r.ing.filter(x=>!/juice|syrup|soda|top|sprite|cola|coke|red bull|lemonade|ginger beer/i.test(x[0]+x[1])).slice(0,2).map(x=>x[0]).join(" · ")||r.ing[0][0];
  return `<button class="card${r.c==="sig"?" sig":""}" data-i="${r.i}">${glass(r.g,r.col)}<span class="nm">${esc(r.n)}</span><span class="sub">${esc(sub)}</span></button>`}
function render(){
  const list=R.filter(match);
  if(!list.length){main.innerHTML=`<p class="empty">No drinks match “${esc(q)}”. Try a spirit or an ingredient.</p>`;return}
  let h="";
  for(const c of ["sig","classic","shot"]){const L=list.filter(r=>r.c===c);if(!L.length)continue;
    if(c!=="sig")L.sort((a,b)=>a.n.localeCompare(b.n));
    h+=`<h2 class="section-h">${CAT[c]} <small>${CATSUB[c]} · ${L.length}</small></h2><div class="grid">${L.map(card).join("")}</div>`}
  main.innerHTML=h;
}
main.onclick=e=>{const b=e.target.closest(".card");if(b)open(R[+b.dataset.i])};
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");let lastFocus=null;
const GN={rocks:"Rocks Glass",highball:"Highball",coupe:"Coupe",martini:"Martini Glass",shot:"Shot Glass",mule:"Copper Mule Mug",wine:"Wine Glass",flute:"Champagne Flute"};
function open(r){
  lastFocus=document.activeElement;
  sheet.innerHTML=`<button class="close" id="close" aria-label="Close">×</button>
  <div class="sheet-head">${glass(r.g,r.col)}<div><h2 id="sheet-title">${esc(r.n)}</h2><span class="tag${r.c==="sig"?" sig":""}">${CAT[r.c]}</span></div></div>
  <dl class="meta"><dt>Glassware</dt><dd>${GN[r.g]}</dd>${r.garn?`<dt>Garnish</dt><dd>${esc(r.garn)}</dd>`:""}</dl>
  <div class="box"><h3>Ingredients</h3><div class="ing">${r.ing.map(([a,b])=>`<div>${esc(a)}</div><div class="amt">${esc(b)}</div>`).join("")}</div></div>
  <div class="box"><h3>Directions</h3><ol class="dir">${r.dir.map(d=>`<li>${esc(d)}</li>`).join("")}</ol></div>
  ${r.note?`<p class="note">${esc(r.note)}</p>`:""}`;
  sheet.hidden=scrim.hidden=false;sheet.scrollTop=0;document.getElementById("close").onclick=close;document.getElementById("close").focus();
}
function close(){sheet.hidden=scrim.hidden=true;lastFocus&&lastFocus.focus()}
scrim.onclick=close;document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)close()});
render();
</script>
